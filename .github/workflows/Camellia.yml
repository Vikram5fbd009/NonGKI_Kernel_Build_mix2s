name: Build Kernel camellia 4.14 KSU-Next SUSFS

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'

env:
  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  KERNELSU_METHOD: "shell"
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Build_2nd"
  PATCHES_BRANCH: "mainline"
  HOOK_METHOD: "normal"
  KERNELSU_SUS_PATCH: "true"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek"
  BUILD_DEBUGGER: "false"
  BUILD_OTHER_CONFIG: "false"
  DEVICE_NAME: "xiaomi_camellia"
  DEVICE_CODENAME: "camellia"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld"
  KERNEL_SOURCE: "https://github.com/vikram2fbd009-maker/Overclock_mt6833"
  KERNEL_BRANCH: "flyme"
  CLANG_SOURCE: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
  CLANG_BRANCH: "master-kernel-build-2022"
  GCC_GNU: "false"
  GCC_64_SOURCE: "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_64_BRANCH: "aarch64"
  GCC_32_SOURCE: "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_32_BRANCH: "arm32"
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "camellia_defconfig"
  DEFCONFIG_ORIGIN_DEFCONFIG: ""
  # ✅ KernelSU Next का SUSFS-compatible fork
  KERNELSU_SOURCE: "https://raw.githubusercontent.com/galaxybuild-project/KernelSU-Next/next/kernel/setup.sh"
  KERNELSU_BRANCH: "next"
  KERNELSU_NAME: "KernelSU-Next"
  SUSFS_ENABLE: "true"
  SUSFS_FIXED: "true"
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  BOOT_SOURCE: ""
  LXC_ENABLE: "false"
  HAVE_NO_DTBO: "false"
  ROM_TEXT: "flyme"

jobs:
  build:
    name: Build Kernel by ${{ github.actor }} in Arch Linux
    runs-on: ubuntu-latest
    container: archlinux/archlinux:latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Move Patches to /tmp
        run: |
          if [ -d "$GITHUB_WORKSPACE/Patches" ]; then
            mv "$GITHUB_WORKSPACE/Patches" /tmp/Patches
            echo "Patches moved to /tmp/Patches"
            ls /tmp/Patches
          else
            echo "ERROR: Patches/ folder missing!"
            exit 1
          fi

      - name: Install packages
        run: |
          pacman -Syyu --noconfirm
          pacman -S git base-devel systemd patch ccache automake flex lzop bison \
            gperf zip curl bzip2 squashfs-tools pngcrush schedtool make optipng \
            maven pwgen minicom bc unzip 7zip zstd binutils gcc python3 wget which --noconfirm

      - name: Setup Toolchains
        run: |
          cd $GITHUB_WORKSPACE
          if [ -n "${{ env.GCC_64_SOURCE }}" ] && [[ "${{ env.GCC_64_SOURCE }}" == *".git" ]]; then
            git clone ${{ env.GCC_64_SOURCE }} -b ${{ env.GCC_64_BRANCH }} gcc-64 --depth=1
            echo "GCC_64=CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android-" >> $GITHUB_ENV
          fi
          if [ -n "${{ env.GCC_32_SOURCE }}" ] && [[ "${{ env.GCC_32_SOURCE }}" == *".git" ]]; then
            git clone ${{ env.GCC_32_SOURCE }} -b ${{ env.GCC_32_BRANCH }} gcc-32 --depth=1
            echo "GCC_32=CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/arm-linux-androideabi-" >> $GITHUB_ENV
          fi
          git clone "${{ env.CLANG_SOURCE }}" -b "${{ env.CLANG_BRANCH }}" clang-custom --depth=1
          CLANG_BIN="$GITHUB_WORKSPACE/clang-custom/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            CLANG_BIN=$(find "$GITHUB_WORKSPACE/clang-custom" -maxdepth 2 -type d -name bin | grep -E 'clang-r[0-9a-f]+/bin$' | head -1)
          fi
          echo "CLANG_BIN_DIR=$CLANG_BIN" >> $GITHUB_ENV
          echo "$CLANG_BIN" >> $GITHUB_PATH
          "$CLANG_BIN/clang" --version | head -1

      - name: Get Kernel Source
        run: |
          cd $GITHUB_WORKSPACE
          git clone --recursive ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_BRANCH }} device_kernel --depth=1
          KVER=$(head -n 3 device_kernel/Makefile | grep -E 'VERSION|PATCHLEVEL' | awk '{print $3}' | paste -sd '.')
          echo "KERNEL_VERSION=$KVER" >> $GITHUB_ENV
          echo "Detected KERNEL_VERSION=$KVER"

      - name: DEFCONFIG (KSU + SUSFS + Storage + Media)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          DEFCONFIG=./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

          {
            echo "CONFIG_KSU=y"
            if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            fi
            echo "CONFIG_EXFAT_FS=y"
            echo "CONFIG_NTFS3_FS=y"
            echo "CONFIG_F2FS_FS=y"
            echo "CONFIG_EXT4_FS=y"
            echo "CONFIG_VFAT_FS=y"
            echo "CONFIG_MSDOS_FS=y"
            echo "CONFIG_ANDROID_BINDER_IPC=y"
            echo 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"'
            echo "CONFIG_MEDIA_SUPPORT=y"
            echo "CONFIG_VIDEO_DEV=y"
          } >> $DEFCONFIG

      - name: KernelSU-Next + SUSFS + AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          SUSFS_SOURCE=https://gitlab.com/simonpunk/susfs4ksu.git
          SUSFS_BRANCH=kernel-${{ env.KERNEL_VERSION }}

          if [[ "${{ env.PACK_METHOD }}" == "Anykernel3" ]]; then
            if [ ! -d "Anykernel3" ]; then
              git clone ${{ env.AK3_SOURCE }} -b ${{ env.AK3_BRANCH }} Anykernel3 --depth=1
            fi
          fi

          if [[ "${{ env.KERNELSU_METHOD }}" == "shell" ]]; then
            curl -sSL ${{ env.KERNELSU_SOURCE }} | bash -s ${{ env.KERNELSU_BRANCH }}
          fi

          if [ -d "${{ env.KERNELSU_NAME }}" ]; then
            KSU_VERSION=$(cd ${{ env.KERNELSU_NAME }} && git rev-list --count HEAD 2>/dev/null || echo "unknown")
            echo "UPLOADNAME=-${{ env.KERNELSU_NAME }}_$KSU_VERSION" >> $GITHUB_ENV
          else
            echo "UPLOADNAME=-KSUN" >> $GITHUB_ENV
          fi

          if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
            if [[ "${{ env.SUSFS_FIXED }}" == "true" ]]; then
              git clone https://github.com/${{ env.PATCHES_SOURCE }}.git -b ${{ env.PATCHES_BRANCH }} NonGKI_Kernel_Patches --depth=1
            fi
            git clone $SUSFS_SOURCE -b $SUSFS_BRANCH susfs4ksu --depth=1
            cp susfs4ksu/kernel_patches/fs/* fs/
            cp susfs4ksu/kernel_patches/include/linux/* include/linux/
          fi

      - name: Apply patches (KSU-Next + SUSFS)
        run: |
          cd $GITHUB_WORKSPACE
          KERNEL=$(echo "${{ env.KERNEL_VERSION }}" | awk -F '.' '{print $1}')
          PATCHLEVEL=$(echo "${{ env.KERNEL_VERSION }}" | awk -F '.' '{print $2}')

          if ! grep -q "CONFIG_KSU" "device_kernel/fs/exec.c" 2>/dev/null; then
            if [[ "${{ env.HOOK_METHOD }}" == "normal" ]] && [ -f "/tmp/Patches/normal_patches.sh" ]; then
              cp /tmp/Patches/normal_patches.sh device_kernel/
              cd device_kernel && bash normal_patches.sh || true
              if [ "$KERNEL" -lt 5 ] && [ "$PATCHLEVEL" -lt 14 ]; then
                cp /tmp/Patches/extra_patches.sh ./ && bash extra_patches.sh || true
              fi
              if [[ "${{ env.KERNELSU_NAME }}" != "KernelSU-Next" ]]; then
                cp /tmp/Patches/backport_patches.sh ./ && bash backport_patches.sh || true
              fi
            fi
          fi

          cd $GITHUB_WORKSPACE/device_kernel/

          echo ""
          echo "=============================================="
          echo " STEP 1: Core SUSFS kernel patch"
          echo "=============================================="
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_kernel-${{ env.KERNEL_VERSION }}.patch"
          if [ ! -f "$SUSFS_PATCH" ]; then
            echo "❌ Core SUSFS patch not found: $SUSFS_PATCH"
            exit 1
          fi
          cp "$SUSFS_PATCH" ./
          if patch -p1 --batch < "$(basename "$SUSFS_PATCH")"; then
            echo "✅ Core SUSFS patch applied."
          else
            echo "❌ Core SUSFS patch failed. Check rejects:"
            find . -name "*.rej" | head -20
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo " STEP 2: KernelSU-Next SUSFS-enable patch"
          echo "=============================================="
          if [[ "${{ env.KERNELSU_NAME }}" == "KernelSU-Next" ]]; then
            # KernelSU-Next के लिए अलग patch path
            KSU_SUS_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            if [ ! -f "$KSU_SUS_PATCH" ]; then
              echo "⚠️ KSU-SUSFS patch file missing: $KSU_SUS_PATCH"
              echo "   KernelSU-Next में पहले से SUSFS support हो सकता है, skip कर रहे हैं."
            else
              cp "$KSU_SUS_PATCH" ./${{ env.KERNELSU_NAME }}/
              cd ${{ env.KERNELSU_NAME }}

              # Check if the patch is even compatible
              if patch -p1 --batch --dry-run < 10_enable_susfs_for_ksu.patch >/dev/null 2>&1; then
                patch -p1 --batch < 10_enable_susfs_for_ksu.patch
                echo "✅ KSU-Next SUSFS-enable patch applied."
              else
                echo ""
                echo "⚠️ KSU-Next SUSFS patch cannot apply cleanly (structure अलग है)."
                echo "   KernelSU-Next में built-in SUSFS support हो सकता है, इसलिए skip."
                echo "   Build आगे बढ़ेगी."
                find . -name "*.rej" -delete 2>/dev/null || true
                git checkout . >/dev/null 2>&1 || true
              fi
              cd ..
            fi
          else
            echo "Skipping (not KernelSU-Next)."
          fi

          echo ""
          echo "=============================================="
          echo " STEP 3: Extra Non-GKI patch"
          echo "=============================================="
          PATCH_FILE="susfs_patch_to_${{ env.KERNEL_VERSION }}.patch"
          if [ -f "NonGKI_Kernel_Patches/Patches/Patch/$PATCH_FILE" ]; then
            cp "NonGKI_Kernel_Patches/Patches/Patch/$PATCH_FILE" ./
            if patch -p1 --batch < "$PATCH_FILE"; then
              echo "✅ Extra patch applied."
            else
              echo "⚠️ Extra patch had failures — cleaning rejects."
              find . -name "*.rej" -delete 2>/dev/null || true
            fi
          fi

          find . -name "*.rej" -delete 2>/dev/null || true
          find . -name "*.orig" -delete 2>/dev/null || true

          echo ""
          echo "🎉 All patches processed."

      - name: Verify KSU-Next SUSFS integration
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          echo "=== KSU-Next SUSFS integration check ==="
          if [ -d "${{ env.KERNELSU_NAME }}" ]; then
            echo "KernelSU-Next directory exists: ${{ env.KERNELSU_NAME }}"
            if grep -rq "susfs" "${{ env.KERNELSU_NAME }}/kernel/" 2>/dev/null; then
              echo "✅ KernelSU-Next has SUSFS references in kernel/"
            else
              echo "⚠️ KernelSU-Next does NOT have SUSFS references (manager UI control नहीं मिलेगा)"
            fi
          fi

          # Kernel tree में SUSFS symbols
          for sym in susfs_is_current_app_uid susfs_is_inode_sus_path susfs_get_data_path; do
            if grep -rq "$sym" fs/ include/ 2>/dev/null; then
              echo "✅ $sym"
            else
              echo "⚠️ $sym not found"
            fi
          done

      - name: Fix Kconfig sourcing
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          if [ -f kernel/Kconfig ] && grep -q "KSU_SUSFS" kernel/Kconfig; then
            if ! grep -q 'source "kernel/Kconfig"' Kconfig 2>/dev/null; then
              echo '' >> Kconfig
              echo 'source "kernel/Kconfig"' >> Kconfig
            fi
          fi
          # KernelSU-Next का Kconfig भी source करो
          if [ -d "${{ env.KERNELSU_NAME }}" ] && [ -f "${{ env.KERNELSU_NAME }}/kernel/Kconfig" ]; then
            if grep -q "KSU_SUSFS" "${{ env.KERNELSU_NAME }}/kernel/Kconfig" 2>/dev/null; then
              if ! grep -q "source \"${{ env.KERNELSU_NAME }}/kernel/Kconfig\"" Kconfig 2>/dev/null; then
                echo '' >> Kconfig
                echo "source \"${{ env.KERNELSU_NAME }}/kernel/Kconfig\"" >> Kconfig
              fi
            fi
          fi
          grep -rn "KSU_SUSFS" --include="Kconfig*" . | head -5 || true

      - name: Fix fs/stat.c (build safety)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          if grep -q "susfs_is_current_app_uid\|STATX_SUS_KSTAT" fs/stat.c 2>/dev/null; then
            grep -v '<linux/susfs.h>' fs/stat.c > fs/stat.c.tmp1 || true
            grep -v '<linux/susfs_def.h>' fs/stat.c.tmp1 > fs/stat.c.tmp2 || true
            rm -f fs/stat.c.tmp1
            LAST_INC=$(grep -n '^#include' fs/stat.c.tmp2 | tail -1 | cut -d: -f1)
            [ -z "$LAST_INC" ] && LAST_INC=0
            {
              head -n "$LAST_INC" fs/stat.c.tmp2
              echo ""
              echo "/* SUSFS */"
              echo "#include <linux/susfs.h>"
              echo "#include <linux/susfs_def.h>"
              echo "#ifndef CONFIG_KSU_SUSFS"
              echo "static inline bool susfs_is_current_app_uid(void) { return false; }"
              echo "#endif"
              tail -n +$((LAST_INC + 1)) fs/stat.c.tmp2
            } > fs/stat.c.new
            rm -f fs/stat.c.tmp2
            mv fs/stat.c.new fs/stat.c
          fi

          if [ -f include/linux/susfs_def.h ]; then
            if ! grep -q "define STATX_SUS_KSTAT" include/linux/susfs_def.h; then
              printf '\n#ifndef STATX_SUS_KSTAT\n#define STATX_SUS_KSTAT 0x00001000U\n#endif\n#ifndef STATX_SUS_KSTAT_FUSE\n#define STATX_SUS_KSTAT_FUSE 0x00002000U\n#endif\n' >> include/linux/susfs_def.h
            fi
          fi

          for f in fs/super.c fs/namespace.c; do
            if [ -f "$f" ] && grep -q "DEFAULT_KSU_MNT_MINOR_DEV" "$f" && ! grep -q "#define DEFAULT_KSU_MNT_MINOR_DEV" "$f"; then
              sed -i '1i #ifndef DEFAULT_KSU_MNT_MINOR_DEV\n#define DEFAULT_KSU_MNT_MINOR_DEV 234\n#endif' "$f"
            fi
          done

      - name: Fix fs/readdir.c (build safety)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          if [ ! -f fs/readdir.c ]; then exit 0; fi
          if grep -q "FUSE_SUPER_MAGIC" fs/readdir.c && ! grep -q 'linux/magic\.h' fs/readdir.c; then
            LAST_INC=$(grep -n '^#include' fs/readdir.c | tail -1 | cut -d: -f1)
            [ -z "$LAST_INC" ] && LAST_INC=0
            {
              head -n "$LAST_INC" fs/readdir.c
              echo "#include <linux/magic.h>"
              echo "#ifndef FUSE_SUPER_MAGIC"
              echo "#define FUSE_SUPER_MAGIC 0x65735546"
              echo "#endif"
              tail -n +$((LAST_INC + 1)) fs/readdir.c
            } > fs/readdir.c.new
            mv fs/readdir.c.new fs/readdir.c
          fi
          if grep -q "susfs_is_inode_sus_path\|susfs_get_data_path" fs/readdir.c; then
            grep -v '<linux/susfs.h>' fs/readdir.c > fs/readdir.c.tmp1 || true
            LAST_INC=$(grep -n '^#include' fs/readdir.c.tmp1 | tail -1 | cut -d: -f1)
            [ -z "$LAST_INC" ] && LAST_INC=0
            {
              head -n "$LAST_INC" fs/readdir.c.tmp1
              echo ""
              echo "/* SUSFS */"
              echo "#include <linux/susfs.h>"
              echo "#ifndef CONFIG_KSU_SUSFS"
              echo "static inline bool susfs_is_inode_sus_path(struct inode *inode) { return false; }"
              echo "static inline int susfs_get_data_path(struct path *path) { return 0; }"
              echo "#endif"
              tail -n +$((LAST_INC + 1)) fs/readdir.c.tmp1
            } > fs/readdir.c.new
            rm -f fs/readdir.c.tmp1
            mv fs/readdir.c.new fs/readdir.c
          fi
          python3 - <<'PYEOF'
          path = 'fs/readdir.c'
          with open(path) as f: lines = f.readlines()
          NEW = '\tstruct inode *inode;\n'
          out, i, inserted = [], 0, 0
          while i < len(lines):
              line = lines[i]
              if 'inode = ilookup(buf->sb, ino)' in line:
                  has_decl = any('struct inode *inode' in lines[j] for j in range(max(0, i - 40), i))
                  if not has_decl:
                      out.append(NEW); inserted += 1
              out.append(line); i += 1
          with open(path, 'w') as f: f.writelines(out)
          print(f'[readdir.c] inserted {inserted}')
          PYEOF

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-${{ env.DEVICE_NAME }}
          max-size: 2G
          create-symlink: true

      - name: Build Kernel
        run: |
          export PATH="${{ env.CLANG_BIN_DIR }}:$GITHUB_WORKSPACE/gcc-64/bin:$GITHUB_WORKSPACE/gcc-32/bin:$PATH"
          cd $GITHUB_WORKSPACE/device_kernel/

          KCFLAGS_FIX="-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=return-type -Wno-error=macro-redefined"

          make O=out ARCH=arm64 \
               CC="ccache clang" LD="ld.lld" \
               CLANG_TRIPLE="aarch64-linux-gnu-" \
               CROSS_COMPILE="aarch64-linux-android-" \
               CROSS_COMPILE_ARM32="arm-linux-androideabi-" \
               KCFLAGS="$KCFLAGS_FIX" \
               ${{ env.DEFCONFIG_NAME }}

          echo ""
          echo "============= SUSFS CONFIG CHECK ============="
          if grep -q "^CONFIG_KSU_SUSFS=y" out/.config; then
            echo "✅ CONFIG_KSU_SUSFS=y in .config"
            grep "^CONFIG_KSU_SUSFS" out/.config
          else
            echo "❌ CONFIG_KSU_SUSFS missing — forcing..."
            for opt in KSU_SUSFS KSU_SUSFS_HAS_MAGIC_MOUNT KSU_SUSFS_SUS_PATH KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_TRY_UMOUNT KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT; do
              echo "CONFIG_$opt=y" >> out/.config
            done
            make O=out ARCH=arm64 olddefconfig
            if grep -q "^CONFIG_KSU_SUSFS=y" out/.config; then
              echo "✅ Force OK"
            else
              echo "❌ Force failed"
              exit 1
            fi
          fi
          echo "=============================================="

          make -j$(nproc --all) O=out ARCH=arm64 \
               CC="ccache clang" LD="ld.lld" \
               CLANG_TRIPLE="aarch64-linux-gnu-" \
               CROSS_COMPILE="aarch64-linux-android-" \
               CROSS_COMPILE_ARM32="arm-linux-androideabi-" \
               KCFLAGS="$KCFLAGS_FIX"

      - name: Package AnyKernel3
        run: |
          IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot"
          TIME=$(date +"%Y%m%d%H%M%S")
          cd $GITHUB_WORKSPACE/device_kernel/
          mkdir -p tmp
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh || true
          if [ -f "$IMAGE_DIR/Image.gz-dtb" ]; then cp -fp "$IMAGE_DIR/Image.gz-dtb" tmp
          elif [ -f "$IMAGE_DIR/Image.gz" ]; then cp -fp "$IMAGE_DIR/Image.gz" tmp
          elif [ -f "$IMAGE_DIR/Image" ]; then gzip -c "$IMAGE_DIR/Image" > "$IMAGE_DIR/Image.gz"; cp -fp "$IMAGE_DIR/Image.gz" tmp; fi
          [ -f "$IMAGE_DIR/dtbo.img" ] && cp -fp "$IMAGE_DIR/dtbo.img" tmp || true
          [ -f "$IMAGE_DIR/dtb" ] && cp -fp "$IMAGE_DIR/dtb" tmp || true
          cp -rp ./Anykernel3/* tmp
          cd tmp && 7za a -mx9 tmp.zip * && cd ..
          OUT_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip"
          cp -fp tmp/tmp.zip "$OUT_ZIP"
          rm -rf tmp
          echo "PACK_NAME=$OUT_ZIP" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ env.PACK_NAME }}
          path: device_kernel/${{ env.PACK_NAME }}
