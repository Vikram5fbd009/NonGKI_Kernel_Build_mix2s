name: Build Kernel camellia (4.14) with KSU & SUSFS

on:
  workflow_call:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  KERNELSU_METHOD: "shell"
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Build_2nd"
  PATCHES_BRANCH: "mainline"
  HOOK_METHOD: "normal"
  KERNELSU_SUS_PATCH: "true"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek"
  BUILD_DEBUGGER: "false"
  BUILD_OTHER_CONFIG: "false"
  # ===== Inlined from camellia_flyme.env =====
  DEVICE_NAME: "xiaomi_camellia"
  DEVICE_CODENAME: "camellia"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld"
  KERNEL_SOURCE: "https://github.com/vikram2fbd009-maker/Overclock_mt6833"
  KERNEL_BRANCH: "flyme"
  CLANG_SOURCE: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
  CLANG_BRANCH: "master-kernel-build-2022"
  GCC_GNU: "false"
  GCC_64_SOURCE: "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_64_BRANCH: "aarch64"
  GCC_32_SOURCE: "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_32_BRANCH: "arm32"
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "camellia_defconfig"
  DEFCONFIG_ORIGIN_DEFCONFIG: ""
  KERNELSU_SOURCE: "https://raw.githubusercontent.com/rsuntk/KernelSU/refs/heads/main/kernel/setup.sh"
  KERNELSU_BRANCH: "main"
  KERNELSU_NAME: "KernelSU"
  SUSFS_ENABLE: "true"
  SUSFS_FIXED: "true"
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  BOOT_SOURCE: ""
  LXC_ENABLE: "false"
  HAVE_NO_DTBO: "false"
  ROM_TEXT: "flyme"

jobs:
  build:
    name: Build Kernel by ${{ github.actor }} in Arch Linux
    runs-on: ubuntu-latest
    container: archlinux/archlinux:latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Move Patches to /tmp
        run: |
          if [ -d "$GITHUB_WORKSPACE/Patches" ]; then
            mv "$GITHUB_WORKSPACE/Patches" /tmp/Patches
          else
            echo "❌ ERROR: Patches/ folder missing!"
            exit 1
          fi

      - name: Install necessary packages
        run: |
          pacman -Syyu --noconfirm
          pacman -S git base-devel systemd patch ccache automake flex lzop bison gperf zip curl bzip2 squashfs-tools pngcrush schedtool make optipng maven pwgen minicom bc unzip 7zip zstd binutils gcc python3 wget which --noconfirm

      # ... (GCC install steps remain unchanged) ...

      - name: Set Compile Environment
        run: |
          cd $GITHUB_WORKSPACE
          # ... (GCC clone steps remain unchanged) ...
          # Set Clang
          if [[ "${{ env.CLANG_SOURCE }}" == *".git" ]]; then
            git clone ${{ env.CLANG_SOURCE }} -b ${{ env.CLANG_BRANCH }} clang-custom --depth=1
          fi
          # ... (other clang formats) ...
          # Add Clang to PATH for subsequent steps
          echo "$GITHUB_WORKSPACE/clang-custom/bin" >> $GITHUB_PATH

      - name: Get Kernel Source
        run: |
          cd $GITHUB_WORKSPACE
          git clone --recursive ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_BRANCH }} device_kernel --depth=1
          # ... (rest of the step) ...

      # ... (KSU/SUSFS setup steps remain unchanged) ...

      - name: Patch Kernel for no-kprobe
        run: |
          # ... (patch steps remain unchanged) ...

      - name: Patch Kernel of SUSFS
        if: env.SUSFS_ENABLE == 'true'
        run: |
          # ... (SUSFS patch steps remain unchanged) ...

      - name: Fixed Kernel Patch
        if: env.SUSFS_ENABLE == 'true' && env.SUSFS_FIXED == 'true'
        run: |
          # ... (fixed patch steps remain unchanged) ...

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-${{ env.DEVICE_NAME }}${{ env.UPLOADNAME }}
          max-size: 2G
          # Create symlinks so ccache can find clang
          create-symlink: true

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH
          cd $GITHUB_WORKSPACE/device_kernel/
          echo "Building kernel ${{ env.KERNEL_VERSION }} for ${{ env.DEVICE_NAME }}"
          # Use LLVM=1 and explicitly set CC, LD, etc.
          make LLVM=1 LLVM_IAS=1 O=out ARCH=arm64 \
               CC="ccache clang" \
               LD="ld.lld" \
               CROSS_COMPILE="aarch64-linux-gnu-" \
               CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
               CLANG_TRIPLE="aarch64-linux-gnu-" \
               ${{ env.DEFCONFIG_NAME }}
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 O=out ARCH=arm64 \
               CC="ccache clang" \
               LD="ld.lld" \
               CROSS_COMPILE="aarch64-linux-gnu-" \
               CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
               CLANG_TRIPLE="aarch64-linux-gnu-"

      # ... (packaging steps remain unchanged) ...
