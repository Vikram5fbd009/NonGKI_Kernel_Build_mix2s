name: Build Kernel camellia (4.14) with KSU & SUSFS

on:
  workflow_call:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  KERNELSU_METHOD: "shell"
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Build_2nd"
  PATCHES_BRANCH: "mainline"
  HOOK_METHOD: "normal"
  KERNELSU_SUS_PATCH: "true"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek"
  BUILD_DEBUGGER: "false"
  BUILD_OTHER_CONFIG: "false"
  DEVICE_NAME: "xiaomi_camellia"
  DEVICE_CODENAME: "camellia"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld"
  KERNEL_SOURCE: "https://github.com/vikram2fbd009-maker/Overclock_mt6833"
  KERNEL_BRANCH: "flyme"
  CLANG_SOURCE: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
  CLANG_BRANCH: "master-kernel-build-2022"
  GCC_GNU: "false"
  GCC_64_SOURCE: "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_64_BRANCH: "aarch64"
  GCC_32_SOURCE: "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_32_BRANCH: "arm32"
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "camellia_defconfig"
  DEFCONFIG_ORIGIN_DEFCONFIG: ""
  KERNELSU_SOURCE: "https://raw.githubusercontent.com/rsuntk/KernelSU/refs/heads/main/kernel/setup.sh"
  KERNELSU_BRANCH: "main"
  KERNELSU_NAME: "KernelSU"
  SUSFS_ENABLE: "true"
  SUSFS_FIXED: "true"
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  BOOT_SOURCE: ""
  LXC_ENABLE: "false"
  HAVE_NO_DTBO: "false"
  ROM_TEXT: "flyme"

jobs:
  build:
    name: Build Kernel by ${{ github.actor }} in Arch Linux
    runs-on: ubuntu-latest
    container: archlinux/archlinux:latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Move Patches to /tmp
        run: |
          if [ -d "$GITHUB_WORKSPACE/Patches" ]; then
            mv "$GITHUB_WORKSPACE/Patches" /tmp/Patches
            echo "Patches moved to /tmp/Patches"
            ls /tmp/Patches
          else
            echo "ERROR: Patches/ folder missing in your repo!"
            exit 1
          fi

      - name: Install necessary packages
        run: |
          pacman -Syyu --noconfirm
          pacman -S git base-devel systemd patch ccache automake flex lzop bison gperf zip curl bzip2 squashfs-tools pngcrush schedtool make optipng maven pwgen minicom bc unzip 7zip zstd binutils gcc python3 wget which --noconfirm

      - name: Set Compile Environment (GCC + Clang, auto-detect)
        run: |
          cd $GITHUB_WORKSPACE

          if [ -z "${{ env.GCC_64_SOURCE }}" ]; then
            echo "Not set GCC 64!"
          else
            if [[ "${{ env.GCC_64_SOURCE }}" == *".git" ]]; then
              git clone ${{ env.GCC_64_SOURCE }} -b ${{ env.GCC_64_BRANCH }} gcc-64 --depth=1
            fi
            GCC_64_BIN=aarch64-linux-android-
            echo "GCC_64=CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/$GCC_64_BIN" >> $GITHUB_ENV
          fi

          if [ -z "${{ env.GCC_32_SOURCE }}" ]; then
            echo "Not set GCC 32!"
          else
            if [[ "${{ env.GCC_32_SOURCE }}" == *".git" ]]; then
              git clone ${{ env.GCC_32_SOURCE }} -b ${{ env.GCC_32_BRANCH }} gcc-32 --depth=1
            fi
            GCC_32_BIN=arm-linux-androideabi-
            echo "GCC_32=CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/$GCC_32_BIN" >> $GITHUB_ENV
          fi

          CLANG_SRC="${{ env.CLANG_SOURCE }}"
          if [ -z "$CLANG_SRC" ]; then
            echo "Not set Clang!"
          elif [[ "$CLANG_SRC" == *".tar.gz" ]]; then
            wget -O clang.tar.gz "$CLANG_SRC"; mkdir -p clang-custom; tar -C clang-custom/ -zxvf clang.tar.gz
          elif [[ "$CLANG_SRC" == *".tar.xz" ]]; then
            wget -O clang.tar.xz "$CLANG_SRC"; mkdir -p clang-custom; tar -C clang-custom/ -xvf clang.tar.xz --strip-components 1
          elif [[ "$CLANG_SRC" == *".zip" ]]; then
            wget -O clang.zip "$CLANG_SRC"; mkdir -p clang-custom; unzip -q clang.zip -d clang-custom/
          elif [[ "$CLANG_SRC" == *"antman" ]]; then
            mkdir -p clang-custom; cd clang-custom; wget "$CLANG_SRC" -O antman; chmod +x antman; bash antman -S; cd ..
          else
            git clone "$CLANG_SRC" -b "${{ env.CLANG_BRANCH }}" clang-custom --depth=1
          fi

          if [ -x "$GITHUB_WORKSPACE/clang-custom/bin/clang" ]; then
            CLANG_BIN="$GITHUB_WORKSPACE/clang-custom/bin"
          else
            CLANG_BIN=$(find "$GITHUB_WORKSPACE/clang-custom" -maxdepth 2 -type d -name bin 2>/dev/null | grep -E 'clang-r[0-9a-f]+/bin$' | head -1)
            if [ -z "$CLANG_BIN" ]; then
              CLANG_BIN=$(find "$GITHUB_WORKSPACE/clang-custom" -maxdepth 3 -type f -name clang 2>/dev/null | head -1 | xargs -r dirname)
            fi
          fi

          echo "Detected CLANG_BIN=$CLANG_BIN"
          if [ -x "$CLANG_BIN/clang" ]; then
            echo "Using prebuilt clang at $CLANG_BIN"
            echo "$CLANG_BIN" >> $GITHUB_PATH
            echo "CLANG_BIN_DIR=$CLANG_BIN" >> $GITHUB_ENV
            "$CLANG_BIN/clang" --version | head -2
            if [ ! -x "$CLANG_BIN/ld.lld" ]; then
              pacman -S --noconfirm lld
            fi
          else
            echo "No prebuilt clang — installing system clang + lld"
            pacman -S --noconfirm clang lld llvm
          fi

      - name: Get Kernel Source
        run: |
          cd $GITHUB_WORKSPACE
          echo "Cloning ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_BRANCH }}"
          git clone --recursive ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_BRANCH }} device_kernel --depth=1
          if [[ -n "${{ env.DEFCONFIG_SOURCE }}" ]]; then
            wget ${{ env.DEFCONFIG_SOURCE }} -O device_kernel/arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          fi
          KVER=$(head -n 3 device_kernel/Makefile | grep -E 'VERSION|PATCHLEVEL' | awk '{print $3}' | paste -sd '.')
          echo "KERNEL_VERSION=$KVER" >> $GITHUB_ENV
          echo "Detected KERNEL_VERSION=$KVER"

      - name: Set KSU, SUSFS, and Storage/Media for DEFCONFIG
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          DEFCONFIG=./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

          # KernelSU & SUSFS
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
            echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
            # NOTE: SUS_MOUNT abhi disable hai kyunki storage break ho sakta tha
            # echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
            # echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
            echo "# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG
          fi

          # Storage & Filesystem Support
          echo "CONFIG_EXFAT_FS=y" >> $DEFCONFIG
          echo "CONFIG_NTFS3_FS=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_FS=y" >> $DEFCONFIG
          echo "CONFIG_EXT4_FS=y" >> $DEFCONFIG
          echo "CONFIG_VFAT_FS=y" >> $DEFCONFIG
          echo "CONFIG_MSDOS_FS=y" >> $DEFCONFIG
          echo "CONFIG_SDCARD_FS=y" >> $DEFCONFIG

          # Media & Binder
          echo "CONFIG_ANDROID_BINDER_IPC=y" >> $DEFCONFIG
          echo 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"' >> $DEFCONFIG
          echo "CONFIG_MEDIA_SUPPORT=y" >> $DEFCONFIG
          echo "CONFIG_VIDEO_DEV=y" >> $DEFCONFIG

      - name: Set Pack Method and KernelSU and SUSFS
        run: |
          SUSFS_SOURCE=https://gitlab.com/simonpunk/susfs4ksu.git
          SUSFS_BRANCH=kernel-${{ env.KERNEL_VERSION }}

          if [[ "${{ env.PACK_METHOD }}" == "Anykernel3" ]]; then
            cd $GITHUB_WORKSPACE/device_kernel
            if [[ -d "Anykernel3" ]]; then echo "Found Anykernel3 in kernel!"
            else git clone ${{ env.AK3_SOURCE }} -b ${{ env.AK3_BRANCH }} Anykernel3 --depth=1; fi
          fi
          echo "PACK_METHOD=${{ env.PACK_METHOD }}" >> $GITHUB_ENV

          if [[ "${{ env.KERNELSU_METHOD }}" == "shell" ]]; then
            curl -sSL ${{ env.KERNELSU_SOURCE }} | bash -s ${{ env.KERNELSU_BRANCH }}
          fi
          echo "KERNELSU_METHOD=${{ env.KERNELSU_METHOD }}" >> $GITHUB_ENV

          if [ -d "${{ env.KERNELSU_NAME }}" ]; then
            KSU_VERSION=$(cd ${{ env.KERNELSU_NAME }} && expr $(git rev-list --count HEAD) + 10200)
            echo "UPLOADNAME=-${{ env.KERNELSU_NAME }}_$KSU_VERSION" >> $GITHUB_ENV
          else
            echo "UPLOADNAME=-KSU" >> $GITHUB_ENV
          fi

          if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then
            if [[ "${{ env.SUSFS_FIXED }}" == "true" ]]; then
              if [[ "${{ env.PATCHES_SOURCE }}" == *".git" ]]; then
                echo "Do not set a full URL in PATCHES_SOURCE!"; exit 1
              fi
              git clone https://github.com/${{ env.PATCHES_SOURCE }}.git -b ${{ env.PATCHES_BRANCH }} NonGKI_Kernel_Patches --depth=1
            fi
            git clone $SUSFS_SOURCE -b $SUSFS_BRANCH susfs4ksu --depth=1
            cp susfs4ksu/kernel_patches/fs/* fs/
            cp susfs4ksu/kernel_patches/include/linux/* include/linux/
          fi

      - name: Patch Kernel for no-kprobe
        run: |
          cd $GITHUB_WORKSPACE
          KERNEL=$(echo "${{ env.KERNEL_VERSION }}" | awk -F '.' '{print $1}')
          PATCHLEVEL=$(echo "${{ env.KERNEL_VERSION }}" | awk -F '.' '{print $2}')
          echo "Kernel=$KERNEL PATCHLEVEL=$PATCHLEVEL"
          if grep -q "CONFIG_KSU" "device_kernel/fs/exec.c" 2>/dev/null; then
            echo "Kernel source already manually patched, skipping."
          else
            if [[ "${{ env.HOOK_METHOD }}" == "normal" ]]; then
              if [[ -f "/tmp/Patches/normal_patches.sh" ]]; then
                cp /tmp/Patches/normal_patches.sh device_kernel/
                cd device_kernel
                bash normal_patches.sh
                echo "Normal patches applied."
                if [ "$KERNEL" -lt 5 ] && [ "$PATCHLEVEL" -lt 14 ]; then
                  cp /tmp/Patches/extra_patches.sh ./
                  bash extra_patches.sh
                  echo "Extra patches applied."
                fi
                if [[ "${{ env.KERNELSU_NAME }}" != "KernelSU-Next" ]]; then
                  cp /tmp/Patches/backport_patches.sh ./
                  bash backport_patches.sh
                  echo "Backport patches applied."
                fi
              else
                echo "normal_patches.sh not found!"; exit 1
              fi
            fi
          fi

      - name: Patch Kernel of SUSFS
        if: env.SUSFS_ENABLE == 'true'
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_kernel-${{ env.KERNEL_VERSION }}.patch ./
          patch -p1 < 50_add_susfs_in_kernel-${{ env.KERNEL_VERSION }}.patch || true

          if [[ "${{ env.KERNELSU_NAME }}" == "KernelSU-Next" ]]; then
            echo "KernelSU-Next detected."
          elif [[ "${{ env.KERNELSU_SUS_PATCH }}" == "true" ]]; then
            cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./${{ env.KERNELSU_NAME }}
            cd ${{ env.KERNELSU_NAME }}
            patch -p1 < 10_enable_susfs_for_ksu.patch || true
            cd ..
          fi

      - name: Patch Debugger
        if: env.BUILD_DEBUGGER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          mapfile -t REJ_FILES < <(find . -type f -name "*.rej")
          if [ ${#REJ_FILES[@]} -eq 0 ]; then echo "No .rej files."
          else
            for CAT_REJ in "${REJ_FILES[@]}"; do
              echo "Found .rej: $CAT_REJ"; cat "$CAT_REJ"; echo "==========EOF=========="
            done
            exit 1
          fi

      # =========================================================
      # 🎯 BUILD ERROR FIX — yahan asli problem solve hoti hai
      # =========================================================
      - name: Apply Fixed SUSFS Patch and Fix fs/stat.c Build Error
        if: env.SUSFS_ENABLE == 'true' && env.SUSFS_FIXED == 'true'
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # 1) Apply fixed patch
          PATCH_FILE="susfs_patch_to_${{ env.KERNEL_VERSION }}.patch"
          if [ -f "NonGKI_Kernel_Patches/Patches/Patch/$PATCH_FILE" ]; then
            cp "NonGKI_Kernel_Patches/Patches/Patch/$PATCH_FILE" ./
            patch -p1 < "$PATCH_FILE" || true
            echo "Applied fixed patch: $PATCH_FILE"
          else
            echo "Fixed patch $PATCH_FILE not found, skipping."
          fi

          # 2) 🎯 fs/stat.c mein missing SUSFS includes inject karo
          #    Yeh wahi fix hai jo build error `STATX_SUS_KSTAT undeclared`
          #    aur `susfs_is_current_app_uid implicit` ko solve karta hai.
          python3 - <<'PYEOF'
          import re, sys, os

          path = 'fs/stat.c'
          with open(path) as f:
              lines = f.readlines()

          content = ''.join(lines)

          # sirf tab inject karo agar susfs code hai par include nahi hai
          if 'susfs_is_current_app_uid' not in content and 'STATX_SUS_KSTAT' not in content:
              print('[stat.c] No susfs code, nothing to fix')
              sys.exit(0)

          if '<linux/susfs_def.h>' in content and '<linux/susfs.h>' in content:
              print('[stat.c] Includes already present, nothing to fix')
              sys.exit(0)

          # last #include line dhoondo
          last_inc = 0
          for i, l in enumerate(lines):
              if l.lstrip().startswith('#include'):
                  last_inc = i

          inject = []
          if '<linux/susfs.h>' not in content:
              inject.append('#include <linux/susfs.h>\n')
          if '<linux/susfs_def.h>' not in content:
              inject.append('#include <linux/susfs_def.h>\n')

          block = ['\n', '#ifdef CONFIG_KSU_SUSFS\n'] + inject + ['#endif\n']
          lines[last_inc + 1:last_inc + 1] = block

          with open(path, 'w') as f:
              f.writelines(lines)

          print('[stat.c] Injected SUSFS includes at line', last_inc + 2)
          print('[stat.c] New head:')
          for l in lines[:last_inc + 8]:
              sys.stdout.write(l)
          PYEOF

          # 3) Agar susfs_def.h mein STATX_SUS_KSTAT macros hi nahi hain
          #    (kuch susfs4ksu branch versions mein missing hota hai) to
          #    fallback defines add karo.
          if [ -f include/linux/susfs_def.h ]; then
            if ! grep -q "define STATX_SUS_KSTAT" include/linux/susfs_def.h; then
              echo "Adding fallback STATX_SUS_KSTAT defines to susfs_def.h"
              cat >> include/linux/susfs_def.h <<'EOF'

/* Fallback defines — real susfs4ksu values */
#ifndef STATX_SUS_KSTAT
#define STATX_SUS_KSTAT		0x00001000U
#endif
#ifndef STATX_SUS_KSTAT_FUSE
#define STATX_SUS_KSTAT_FUSE	0x00002000U
#endif
EOF
            fi
          fi

          # 4) DEFAULT_KSU_MNT_MINOR_DEV inject (agar missing ho)
          if grep -q "DEFAULT_KSU_MNT_MINOR_DEV" fs/super.c && ! grep -q "#define DEFAULT_KSU_MNT_MINOR_DEV" fs/super.c; then
            echo "Injecting DEFAULT_KSU_MNT_MINOR_DEV into fs/super.c"
            sed -i '1i #ifndef DEFAULT_KSU_MNT_MINOR_DEV\n#define DEFAULT_KSU_MNT_MINOR_DEV 234\n#endif' fs/super.c
          fi
          if grep -q "DEFAULT_KSU_MNT_MINOR_DEV" fs/namespace.c 2>/dev/null && ! grep -q "#define DEFAULT_KSU_MNT_MINOR_DEV" fs/namespace.c; then
            echo "Injecting DEFAULT_KSU_MNT_MINOR_DEV into fs/namespace.c"
            sed -i '1i #ifndef DEFAULT_KSU_MNT_MINOR_DEV\n#define DEFAULT_KSU_MNT_MINOR_DEV 234\n#endif' fs/namespace.c
          fi

          echo "=== Final verification ==="
          grep -n "susfs.h\|susfs_def.h" fs/stat.c | head -5 || true
          grep -n "STATX_SUS_KSTAT" include/linux/susfs_def.h || true
          grep -n "DEFAULT_KSU_MNT_MINOR_DEV" fs/super.c | head -3 || true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-${{ env.DEVICE_NAME }}${{ env.UPLOADNAME }}
          max-size: 2G
          create-symlink: true

      - name: Build Kernel
        run: |
          if [ -n "${{ env.CLANG_BIN_DIR }}" ] && [ -x "${{ env.CLANG_BIN_DIR }}/clang" ]; then
            export PATH="${{ env.CLANG_BIN_DIR }}:$PATH"
          fi
          export PATH="$GITHUB_WORKSPACE/gcc-64/bin:$GITHUB_WORKSPACE/gcc-32/bin:$PATH"

          cd $GITHUB_WORKSPACE/device_kernel/

          echo "=== Sanity check ==="
          echo "KERNEL_VERSION=${{ env.KERNEL_VERSION }}"
          echo "clang:                     $(command -v clang || echo MISSING)"
          echo "aarch64-linux-android-as:  $(command -v aarch64-linux-android-as || echo MISSING)"
          echo "ld.lld:                    $(command -v ld.lld || echo MISSING)"
          clang --version 2>&1 | head -1

          KCFLAGS_FIX="-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=return-type -Wno-error=macro-redefined"

          echo "Building kernel ${{ env.KERNEL_VERSION }} for ${{ env.DEVICE_NAME }}"
          make O=out ARCH=arm64 \
               CC="ccache clang" \
               LD="ld.lld" \
               CLANG_TRIPLE="aarch64-linux-gnu-" \
               CROSS_COMPILE="aarch64-linux-android-" \
               CROSS_COMPILE_ARM32="arm-linux-androideabi-" \
               KCFLAGS="$KCFLAGS_FIX" \
               ${{ env.DEFCONFIG_NAME }}

          make -j$(nproc --all) O=out ARCH=arm64 \
               CC="ccache clang" \
               LD="ld.lld" \
               CLANG_TRIPLE="aarch64-linux-gnu-" \
               CROSS_COMPILE="aarch64-linux-android-" \
               CROSS_COMPILE_ARM32="arm-linux-androideabi-" \
               KCFLAGS="$KCFLAGS_FIX"

      - name: Make Anykernel3 Flasher
        if: env.PACK_METHOD == 'Anykernel3'
        run: |
          IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot"
          TIME=$(date +"%Y%m%d%H%M%S")
          cd $GITHUB_WORKSPACE/device_kernel/
          mkdir -p tmp

          if [[ "${{ env.AK3_SOURCE }}" =~ "osm0sis" ]]; then
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
            sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
            sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' Anykernel3/anykernel.sh
          fi

          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then cp -fp "$IMAGE_DIR/Image.gz-dtb" tmp
          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then cp -fp "$IMAGE_DIR/Image.gz" tmp
          elif [[ -f "$IMAGE_DIR/Image" ]]; then gzip -c "$IMAGE_DIR/Image" > "$IMAGE_DIR/Image.gz"; cp -fp "$IMAGE_DIR/Image.gz" tmp; fi

          [[ -f "$IMAGE_DIR/dtbo.img" ]] && cp -fp "$IMAGE_DIR/dtbo.img" tmp
          [[ -f "$IMAGE_DIR/dtb" ]] && cp -fp "$IMAGE_DIR/dtb" tmp

          cp -rp ./Anykernel3/* tmp
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..
          OUT_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip"
          cp -fp tmp/tmp.zip "$OUT_ZIP"
          rm -rf tmp
          echo "PACK_NAME=$OUT_ZIP" >> $GITHUB_ENV

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ env.PACK_NAME }}
          path: |
            device_kernel/${{ env.PACK_NAME }}
